spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/onamnotifier
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    user:
      name: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}

  jpa:
    database: postgresql
    open-in-view: false
    hibernate:
      ddl-auto: update # replace with 'validate' in production
    properties:
      hibernate:
        dialect: ""
        format_sql: true
        show_sql: false

logging:
  level:
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
