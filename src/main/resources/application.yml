spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/onamnotifier
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    user:
      name: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}

  jpa:
    database: postgresql
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ""
        format_sql: true
        show_sql: true